limit_req_zone $binary_remote_addr zone=posting_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name webagent.elgrowth.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/posting-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name webagent.elgrowth.com;

    ssl_certificate /etc/letsencrypt/live/webagent.elgrowth.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webagent.elgrowth.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 1m;
    limit_req_status 429;

    location = /health {
        proxy_pass http://127.0.0.1:8000;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:8000;
    }

    location = /desktop/ws {
        limit_req zone=posting_api burst=5 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        limit_req zone=posting_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
}
