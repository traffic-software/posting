name: posting-vps

services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to the built revision tag}
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/tasks.db
      CHROMIUM_BINARY: /usr/bin/chromium
      CHROMEDRIVER_BINARY: /usr/bin/chromedriver
      REQUIRE_TASK_API_TOKEN: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - tasks_data:/data
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 60s

volumes:
  tasks_data:
