name: posting-vps

services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to the built revision tag}
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/tasks.db
      SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
      REQUIRE_TASK_API_TOKEN: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - tasks_data:/data
    depends_on:
      selenium:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 60s

  selenium:
    image: selenium/standalone-chrome:4.31.0
    shm_size: 2gb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4444/status | grep -Eq '\"ready\"[[:space:]]*:[[:space:]]*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  tasks_data:
